<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Bootstrap Icons -->
<link
  href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
  rel="stylesheet"
/>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', 'Inter', 'sans-serif'],
          display: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', 'Space Grotesk', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
        colors: {
          ink: '#000000',               /* Apple pure black */
          'ink-soft': '#1d1d1f',          /* Apple near-black / dark surface */
          paper: '#f5f5f7',             /* Apple light gray section background */
          card: '#ffffff',              /* Apple white */
          border: '#d2d2d7',            /* Apple hairline border */
          text: '#1d1d1f',              /* Apple main text */
          'text-muted': '#6e6e73',        /* Apple secondary text */
          'text-invert': '#f5f5f7',
          violet: '#0071e3',            /* Apple primary action blue */
          'violet-light': 'rgba(0,113,227,0.12)',
          teal: '#14b8a6',
          'teal-light': 'rgba(20,184,166,0.12)',
          amber: '#f59e0b',
          'amber-light': 'rgba(245,158,11,0.12)',
          rose: '#f43f5e',
          'rose-light': 'rgba(244,63,94,0.12)',
          apple: {
            blue: '#0071e3',
            link: '#0066cc',
            'link-dark': '#2997ff',
            gray: '#f5f5f7',
            soft: '#fbfbfd',
            dark: '#1d1d1f',
            black: '#000000',
            border: '#d2d2d7',
            secondary: '#6e6e73',
            muted: '#86868b',
          }
        }
      }
    }
  }
</script>

<!-- Custom CSS -->
<link
  href="{{ url_for('static',filename='admin/css/admin.css') }}"
  rel="stylesheet"
/>
